<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Audio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <meta name="theme-color" content="#4f46e5">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: #4f46e5;
      color: #fff;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 1rem;
      padding: 1rem;
    }

    h1 {
      font-size: 2.5rem;
      margin: 0;
    }

    p,
    label {
      opacity: .8;
      margin: 0;
    }

    audio {
      width: min(90vw, 420px);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      width: min(90vw, 420px);
    }

    li {
      padding: .5rem .75rem;
      border-radius: 8px;
      cursor: pointer;
    }

    li.active {
      background: rgba(255, 255, 255, .2);
    }

    select,
    input {
      font: inherit;
    }
  </style>
</head>

<body>
  <h1>Hello, Audio!</h1>
  <p id="info"></p>

  <input id="picker" type="file" accept="audio/*" multiple>
  <audio id="player" controls></audio>
  <ul id="list"></ul>

  <button id="rec" hidden>● Record</button>
  <p id="status"></p>
  <a id="download" hidden></a>

  <label id="sessionLabel" hidden>Audio session:
    <select id="session">
      <option>auto</option>
      <option>transient</option>
      <option>transient-solo</option>
      <option>play-and-record</option>
      <option>playback</option>
      <option>ambient</option>
    </select>
  </label>

  <script>
    const $ = id => document.getElementById(id);
    const player = $('player');
    let tracks = [];   // { name, url, key }
    let current = -1;

    // localStorage can throw (private mode, blocked data), so wrap it.
    const store = {
      get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } }
    };

    $('info').textContent = 'Running on ' + (navigator.userAgentData?.platform || navigator.platform);

    // Settings: volume, audio session type
    player.volume = store.get('volume', 1);
    player.addEventListener('volumechange', () => store.set('volume', player.volume));

    if ('audioSession' in navigator) {
      $('sessionLabel').hidden = false;
      $('session').value = store.get('session', 'auto');
      navigator.audioSession.type = $('session').value;
      $('session').addEventListener('change', e => {
        navigator.audioSession.type = e.target.value;
        store.set('session', e.target.value);
      });
    }

    // Playback positions, keyed by name + size so same-named files don't collide.
    const positions = store.get('positions', {});
    player.addEventListener('timeupdate', () => {
      if (current < 0) return;
      positions[tracks[current].key] = player.currentTime;
      store.set('positions', positions);
    });
    player.addEventListener('ended', () => play(current + 1));

    function render() {
      $('list').replaceChildren(...tracks.map((t, i) => {
        const li = document.createElement('li');
        li.textContent = t.name;
        li.className = i === current ? 'active' : '';
        li.onclick = () => play(i);
        return li;
      }));
    }

    function play(i) {
      if (i < 0 || i >= tracks.length) return;
      current = i;
      player.src = tracks[i].url;
      player.currentTime = positions[tracks[i].key] || 0;
      player.play().catch(() => { });   // autoplay may be blocked until the user taps
      store.set('last', tracks[i].key);
      render();
    }

    function addFiles(files) {
      const first = tracks.length;
      for (const f of files) {
        tracks.push({ name: f.name, url: URL.createObjectURL(f), key: f.name + ':' + f.size });
      }
      // Resume the last-played track if it's among the new files, otherwise start the first new one.
      const last = store.get('last', null);
      const resume = tracks.findIndex((t, i) => i >= first && t.key === last);
      play(resume >= 0 ? resume : first);
    }

    $('picker').addEventListener('change', e => addFiles([...e.target.files]));

    // Recording: getUserMedia + MediaRecorder (needs HTTPS and mic permission).
    if (navigator.mediaDevices?.getUserMedia && window.MediaRecorder) {
      $('rec').hidden = false;
      let recorder = null;
      $('rec').addEventListener('click', async () => {
        if (recorder) { recorder.stop(); return; }
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch {
          $('status').textContent = 'Microphone access was denied or is unavailable.';
          return;
        }
        // Safari records mp4, Chrome/Firefox record webm or ogg, so pick what's supported.
        const mime = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus']
          .find(t => MediaRecorder.isTypeSupported(t)) || '';
        const chunks = [];
        recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          const type = recorder.mimeType || 'audio/webm';
          const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
          const file = new File(chunks, `recording-${new Date().toISOString().replace(/[:.]/g, '-')}.${ext}`, { type });
          recorder = null;
          $('rec').textContent = '● Record';
          $('status').textContent = '';
          const a = $('download');
          a.href = URL.createObjectURL(file);
          a.download = file.name;
          a.textContent = 'Download ' + file.name;
          a.hidden = false;
          addFiles([file]);
        };
        recorder.start();
        $('rec').textContent = '■ Stop';
        $('status').textContent = 'Recording…';
        $('download').hidden = true;
      });
    }

    // File Handling: files opened from the OS arrive here (installed Chrome/Edge desktop).
    if ('launchQueue' in window) {
      launchQueue.setConsumer(async params => {
        if (!params.files.length) return;
        addFiles(await Promise.all(params.files.map(h => h.getFile())));
      });
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>

</html>
