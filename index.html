<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <meta name="theme-color" content="#4f46e5">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      text-align: center;
      font-family: system-ui, sans-serif;
      background: #4f46e5;
      color: #fff;
    }

    h1 {
      font-size: 3rem;
      margin: 0 0 .5rem;
    }

    p {
      opacity: .8;
      margin: 0;
    }
  </style>
</head>

<body>
  <h1>Hello, World!</h1>
  <p id="info"></p>
  <script>
    document.getElementById('info').textContent = 'Running on ' + (navigator.userAgentData?.platform || navigator.platform);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>

</html>
